name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica del ritmo
        run: |
          chmod +x gradlew
          ./gradlew :core:test --stacktrace

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Guardar el APK (descargable desde la pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: puerta-abrete-sesamo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # En cada cambio a main, publica el APK en "Releases" para descargarlo
      # fácilmente desde el navegador del teléfono.
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk puerta-abrete-sesamo.apk
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version puerta-abrete-sesamo.apk \
            --title "Última versión" \
            --notes "APK de prueba generado automáticamente. Descárgalo desde el teléfono e instálalo." \
            --target "${{ github.sha }}"
