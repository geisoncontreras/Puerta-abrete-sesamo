name: Probar en un teléfono virtual

# Instala el APK en un emulador de Android, lo abre y comprueba que no se cierra.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Activar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar, abrir y revisar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/probar-en-emulador.sh

      - name: Guardar capturas y registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-emulador
          path: prueba/
